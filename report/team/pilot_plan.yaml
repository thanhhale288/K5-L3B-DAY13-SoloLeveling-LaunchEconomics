# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02) · tính bằng src/lab13.py
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (hệ số thiết kế 1)
#   b) Theo nhân viên, m = 75: hệ số thiết kế 1 + 74 x 0,02 = 2,48; cỡ mẫu 1.251 x 2,48 = 3.103 mỗi nhóm = 42 nhân viên mỗi nhóm, tổng 84 > 40 nhân viên hiện có: không đủ người
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa 20 / 0,02 = 1.000 (không bao giờ đạt tới 1.000) < 1.251: không đạt mức chênh 5 điểm
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa 6 / 0,02 = 300; chỉ 6 cụm mỗi nhóm, dưới 20
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: mỗi nhân viên cần xử lý ít nhất m = 299 yêu cầu (hệ số thiết kế 1 + 298 x 0,02 = 6,96)
#   Hệ quả: nếu tác động thật chỉ là 5 điểm mà ta thiết kế cho 6 điểm (859 mỗi nhóm) thì power chỉ còn 0,64 (statsmodels NormalIndPower); nếu tác động thật là 6 điểm thì power 0,80.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (chia theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng depot với nhóm dùng trợ lý
#   2. Chia ngẫu nhiên hay do người chọn: ngẫu nhiên, bốc thăm bằng code với seed ghi trước, phân tầng theo depot
#   3. Ảnh hưởng gián tiếp và cách giảm: có rủi ro nhân viên cùng depot chia sẻ câu trả lời; giảm bằng quyền truy cập theo tài khoản và log mỗi lượt mở trợ lý theo staff_id
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chốt trước ngày bắt đầu pilot (xem primary_metric, stop_rules, decision_date)
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 nhân viên mỗi nhóm (20 cụm)
#
# Đánh đổi đã chấp nhận (cách chia chưa đạt đủ mẫu cho mức chênh 5 điểm): chấp nhận chỉ phát hiện được mức chênh 6 điểm, với mỗi nhân viên xử lý ít nhất 299 yêu cầu trong phạm vi (khoảng 31 yêu cầu mỗi ngày mỗi nhân viên, suy luận từ 1.500 yêu cầu/ngày x 982/1.200 / 40 nhân viên, nên bước đo kéo dài khoảng 10 ngày làm việc, đặt hai tuần). Nếu tác động thật là 5 điểm thì power còn 0,64; Giám đốc vận hành ký chấp nhận đánh đổi này trước ngày bắt đầu.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn: 4,25% toàn mẫu (51/1.200), 3,97% trong phạm vi noi_dia + hang_nang (39/982). Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu nên không dùng; dùng chênh lệch so với nhóm đối chứng (cao hơn từ 2 điểm) kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ yêu cầu noi_dia và hang_nang ở cả 12 depot (chi phí mỗi việc thành công 0,22x và 0,69x so với 12.000 đ, simulated); loại quoc_te (1,88x, thành công 27,3%) và doi_tac (0,85x, điều khoản riêng) để nhân viên xử lý"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần: 4, 10, 20 nhân viên; bước 0.50 kéo dài hai tuần để đủ 299 yêu cầu mỗi nhân viên; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận (mục tiêu gốc 0,05 cần 1.251 yêu cầu mỗi nhóm, không đạt với 20 nhân viên)
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng depot, không dùng trợ lý"
    spillover_risk: "Có thể chia sẻ câu trả lời trong cùng depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id"
    predeclared: "Có: chỉ số chính, mde 0,06, luật dừng và ngày quyết định chốt trước ngày bắt đầu; bốc thăm ngẫu nhiên bằng code, seed ghi trước, phân tầng theo depot"
  stop_rules:
    - "NẾU tỉ lệ mở lại trong 7 ngày của nhóm dùng trợ lý cao hơn nhóm đối chứng từ 2 điểm phần trăm trở lên, hoặc vượt 6% tuyệt đối, hoặc có ít nhất 1 ca hoàn trùng, TRONG 3 ngày liên tiếp (mỗi điều kiện tính riêng) THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và Kỹ sư trưởng agent rà 20 trace gần nhất KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công vượt 8.000 đ (simulated; mức hiện tại 4.472 đ) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp pilot về noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được mở thêm hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua hoặc bo) vượt 40% (mức hiện tại 27,1%) TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý trong bảng quản trị, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm như trước pilot"
  decision_date: "2027-01-15"     # suy luận: bắt đầu 2026-12-14, 3 bước (1 + 1 + 2 tuần) rồi chốt; điều chỉnh theo lịch thật
  simulated_inputs: ["phut_xem_lai_simulated", "phut_lam_lai_simulated", "chi phí mỗi việc thành công 4.472 đ và các so sánh với 12.000 đ", "ngưỡng chi phí 8.000 đ", "chi phí cố định 40 triệu đ/tháng"]
